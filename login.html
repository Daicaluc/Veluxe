<html class="moveable">
    <head>
        <meta charset="utf-8">
        <title>Veluxe | Log in</title>
        <link rel="shortcut icon" href="./images/Veluxe logo(1).png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="./style/veluxe-login.css" rel="stylesheet">
    </head>
    <body>
        <div class="formulario">
            <h1>Inicio de sesion</h1>
            <form method="post">
                <div class="username">
                    <input type="text" required>
                    <label>Nombre de usuario</label>
                </div>
                <div class="contrasena">
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>
                <div class="terms-and-service">
                    <input type="checkbox" id="terms-and-service" required>
                    <label for="terms-and-service" class="termycon"><a>Recordarme</a></label>
                </div>
                <div class="recordar">¿Olvido su contraseña?</div>
                <input type="submit" value="Iniciar Sesion">
                <div class="registrarse">
                    <a href="./register.html"><b>Registrarme</b></a>
                </div>
            </form>
        </div>
    </body>
</html>
