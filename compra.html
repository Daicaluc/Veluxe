<html class="moveable">
    <head>
        <meta charset="utf-8">
        <title>Veluxe | Compra</title>
        <link rel="shortcut icon" href="./images/Veluxe logo(1).png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="./style/veluxe-compra.css" rel="stylesheet">
    </head>
    <body>
        <div class="formulario">
            <h1>Realizar compra</h1>
            <form method="post" action="enviar.php" >
                <div class="columna2">
                    <label for="nombre">Nombre:</label>
                </div>
                <input type="text" name="nombre" id="nombre"  placeholder="Tu nombre.." required>
                <div class="columna2">
                  <label for="nombre">Direccion postal:</label>
                </div>
                <input type="text" id="direccion" name="nombre" placeholder="Tu direccion.." required>
                <div class="columna2">
                    <label for="email">Email:</label>
                </div>
                <input type="text" id="email" name="email" placeholder="Tu email.." required>
                <div class="columna2">
                    <label for="nombre">Datos bancarios:</label>
                </div>
                <input type="number" id="nombre" name="nombre" placeholder="Introduce el numero de tarjeta.." maxlength="16" placeholder="xxxx xxxx xxxx xxxx" required>
                <input type="month"  id="fecha" name="nombre" placeholder="Fecha.." required>
                <input type="password" class="secreto" id="nombre" name="nombre" placeholder="CCV.." maxlength="3" required>
                <div class="columna2">
                    <label for="nombre">Numero de telefono:</label>
                </div>
                <input type="number" id="nombre" name="nombre" placeholder="Introduce el numero de telefono.." maxlength="9" required>

                <div class="columna2">
                    <label for="mensaje">Especifica el modelo:</label>
                </div>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe el nombre del producto.." required></textarea>
                <input type="submit" value="Enviar">
            </form>
        </div>
    </body>
</html>
