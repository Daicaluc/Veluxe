<html class="moveable">
    <head>
        <meta charset="utf-8">
        <title>Veluxe | Registro</title>
        <link rel="shortcut icon" href="./images/Veluxe logo(1).png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="./style/veluxe-register.css" rel="stylesheet">
    </head>
    <body>
        <div class="formulario">
            <h1>Registrarse</h1>
            <form method="post">
                <div class="username">
                    <input type="text" required>
                    <label>Nombre de usuario</label>
                </div>
                <div class="username">
                    <input type="text" required>
                    <label>Correo electrónico</label>
                </div>
                <div class="contrasena">
                    <input type="password" required>
                    <label>Contraseña</label>
                </div>
                <div class="contrasena">
                    <input type="password" required>
                    <label>Verificar Contraseña</label>
                </div>
                <div class="terms-and-service">
                    <input type="checkbox" id="terms-and-service" required>
                    <label for="terms-and-service" class="termycon">Acepto los <a href="/terms-of-service">Términos de uso</a> y he leeído la <a href="/privacy-policy">Política de privacidad</a></label>
                </div>
                <input type="submit" value="Registrarme">
                <div class="registrarse">
                    <a href="./login.html"><b>Iniciar sesión</b></a>
                </div>
            </form>
        </div>
    </body>
</html>
